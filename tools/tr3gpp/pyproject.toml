[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tr3gpp"
version = "0.1.0"
description = "Typed Python access to 3gpp-tr-library's structured TR data (pathloss, LOS probability, O2I penetration loss, and more)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
tr3gpp = "tr3gpp.cli:main"

[tool.setuptools]
packages = ["tr3gpp"]
package-dir = {"tr3gpp" = "."}

# The processed TR data, bundled so an installed wheel is self-contained.
# Generated by `python tools/sync_package_data.py` (gitignored, regenerated on
# build) from the repo-root TR-*/ directories, which stay the single source of
# truth. The globs are written out by depth rather than using `**` so they work
# on any setuptools >= 61: the layout is always
# data/<TR>/<version>/<chapter>/{*.md,*.yaml,tables/*.csv}.
[tool.setuptools.package-data]
tr3gpp = [
    "data/*/*/*/*.md",
    "data/*/*/*/*.yaml",
    "data/*/*/*/tables/*.csv",
]
