[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tr3gpp"
version = "0.2.0"
description = "Hand-verified 3GPP channel-model parameters as typed Python objects: TR 38.901 pathloss, fast fading, additional modelling components and ISAC, plus TR 36.777 aerial-UE deltas."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehdi Zafari" }]
maintainers = [{ name = "Mehdi Zafari" }]
keywords = [
    "3gpp",
    "channel-model",
    "5g",
    "nr",
    "wireless",
    "propagation",
    "pathloss",
    "fast-fading",
    "isac",
    "mimo",
    "simulation",
    "tr-38901",
    "tr-36777",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

# requires-python is >=3.9 for real runtime reasons, not caution: the accessors
# use PEP 585 builtin generics in return annotations (`-> list[NotationEntry]`),
# which are evaluated at def time and raise on 3.8; `_loader` uses
# `importlib.resources.files()` (3.9+); and pydantic 2 itself requires >=3.9.

[project.urls]
Homepage = "https://github.com/MehdiZD97/3gpp-tr-library"
Documentation = "https://github.com/MehdiZD97/3gpp-tr-library/blob/main/tools/tr3gpp/README.md"
Repository = "https://github.com/MehdiZD97/3gpp-tr-library"
Issues = "https://github.com/MehdiZD97/3gpp-tr-library/issues"
Changelog = "https://github.com/MehdiZD97/3gpp-tr-library/releases"
# The Zenodo *concept* DOI: always resolves to the latest archived release.
"Archive (DOI)" = "https://doi.org/10.5281/zenodo.21501655"

[project.scripts]
tr3gpp = "tr3gpp.cli:main"

[tool.setuptools]
packages = ["tr3gpp"]
package-dir = {"tr3gpp" = "."}

# The processed TR data, bundled so an installed wheel is self-contained.
# Generated by `python tools/sync_package_data.py` (gitignored, regenerated on
# build) from the repo-root TR-*/ directories, which stay the single source of
# truth. The globs are written out by depth rather than using `**` so they work
# on any modern setuptools: the layout is always
# data/<TR>/<version>/<chapter>/{*.md,*.yaml,tables/*.csv}.
[tool.setuptools.package-data]
tr3gpp = [
    "py.typed",
    "data/*/*/*/*.md",
    "data/*/*/*/*.yaml",
    "data/*/*/*/tables/*.csv",
]
